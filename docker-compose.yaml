version: "3.8"

services:
  api:
    container_name: evolution_api
    image: evoapicloud/evolution-api:latest
    restart: always
    depends_on:
      - redis
      - evolution-postgres
    ports:
      - "8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
      - ./manager/dist:/evolution/manager/dist:ro
    networks:
      - evolution-net
    env_file:
      - .env
    expose:
      - "8080"

  frontend:
    container_name: evolution_frontend
    image: evoapicloud/evolution-manager:latest
    restart: always
    ports:
      - "4433:80"
    volumes:
      - ./manager-nginx.conf:/etc/nginx/conf.d/nginx.conf:ro
      - ./manager/dist:/usr/share/nginx/html:ro
    networks:
      - evolution-net

  redis:
    container_name: evolution_redis
    image: redis:latest
    restart: always
    command: >
      redis-server --port 6379 --appendonly yes
    volumes:
      - evolution_redis:/data
    networks:
      evolution-net:
        aliases:
          - redis
          - evolution-redis
    expose:
      - "6379"

  evolution-postgres:
    container_name: evolution_postgres
    image: postgres:15
    restart: always
    env_file:
      - .env
    command:
      - postgres
      - -c
      - max_connections=1000
      - -c
      - listen_addresses=*
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE}
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      evolution-net:
        aliases:
          - postgres
          - evolution-postgres
    expose:
      - "5432"

  webhook-filter:
    container_name: webhook_filter
    image: node:alpine
    restart: always
    working_dir: /app
    volumes:
      - ./webhook-filter:/app
    environment:
      - PORT=3050
      - TARGET_GROUPS=${TARGET_GROUPS:-${TARGET_GROUP:-}}
      - WEBHOOK_DESTINATIONS=${WEBHOOK_DESTINATIONS:-${N8N_WEBHOOK_URL:-}}
    command: node server.js
    ports:
      - "3050:3050"
    networks:
      evolution-net:
        aliases:
          - webhook-filter
    expose:
      - "3050"

volumes:
  evolution_instances:
  evolution_redis:
  postgres_data:

networks:
  evolution-net:
    name: evolution-net
    driver: bridge